name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build (typecheck + compile)
        run: npm run build

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/e-commerse-back

            git fetch --all
            git reset --hard origin/main

            # NOTE: devDependencies are required here - `nest build` comes from
            # @nestjs/cli and `prisma generate` from the prisma CLI, both of
            # which live in devDependencies. Do not use --omit=dev.
            npm ci

            npx prisma generate
            npx prisma db push --skip-generate

            npm run build

            pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js
            pm2 save
